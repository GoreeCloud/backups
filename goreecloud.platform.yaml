continuity:
  backup:
    required: true
    requirements:
      - GoreeCloud Backups application state and configuration must itself have an independently documented recovery strategy before production acceptance.
      - Recovery metadata and required configuration must not become dependent on one control-plane instance.
  restore:
    required: true
    requirements:
      - Clean-environment restoration must be validated before production or Stable recovery claims.
      - Loss of the original control plane must not automatically make a healthy backup repository unusable.
  export:
    required: true
    requirements:
      - Repository metadata, configuration, policies, and user-owned operational records must have documented portable recovery or export paths where applicable.
  portability:
    required: true
    requirements:
      - The native repository format must remain documented and recoverable without unnecessary dependence on one storage provider or graphical interface.

